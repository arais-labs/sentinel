# The first boot only (Ubuntu's signed GRUB from its netboot files reads /grub/grub.cfg): Ubuntu's
# kernel, which builds in the virtio disk and ext4, runs the build script on the root disk as init.
# The build replaces GRUB with systemd-boot and this file goes.
linux /sentinel/linux root=/dev/vdb rw init=/usr/sbin/sentinel-build console=hvc0
boot
