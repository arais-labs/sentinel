name: CI
# PRs test source and build candidates. Release only promotes tested artifacts.
# A candidate is the app (installer + payload) and the workspace runtime components it downloads:
# each component has its own workflow (sentineld.yml, sentinel-workspace.yml), which
# reuses its last build when its sources are unchanged.
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  actions: read
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check version and release direction
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          scripts/sync-version.sh --check
          if [ "$BASE" = main ]; then
            test "$HEAD" = beta
          fi
          if [ "$BASE" = beta ] || [ "$BASE" = main ]; then
            scripts/sync-version.sh --check --greater-than "origin/$BASE"
          fi

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/sentinel/uv.lock
          python-version: '3.12'

      - name: Install backend deps
        working-directory: apps/backend/sentinel
        run: uv sync --group dev

      - name: Test backend
        working-directory: apps/backend/sentinel
        run: |
          uv run python -m compileall app tests
          uv run pytest tests/ -q

  desktop-typecheck:
    name: Desktop Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/desktop/sentinel/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop/sentinel
        run: npm ci

      - name: Typecheck and desktop unit tests
        working-directory: apps/desktop/sentinel
        run: npm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/sentinel/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend/sentinel
        run: npm ci

      - name: Build
        working-directory: apps/frontend/sentinel
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: apps/frontend/sentinel/dist/
          if-no-files-found: error
          retention-days: 7

  sentineld:
    name: sentineld
    uses: ./.github/workflows/sentineld.yml

  sentinel-workspace:
    name: sentinel-workspace
    uses: ./.github/workflows/sentinel-workspace.yml

  desktop-installer:
    name: Build desktop installer
    # The app bundles no runtime component: it never waits for them.
    needs: [version, frontend-build]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SENTINEL_BUILD_CHANNEL: beta
      SENTINEL_FRONTEND_DIST: ${{ github.workspace }}/apps/frontend/sentinel/dist
      SENTINEL_INTERNAL_BUILD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
    defaults:
      run:
        working-directory: apps/desktop/sentinel
    steps:
      - uses: actions/checkout@v6
      - name: Select toolchain
        id: toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          test "$(uname -m)" = arm64
          echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/desktop/sentinel/package-lock.json
            apps/frontend/sentinel/package-lock.json
      - name: Cache bundled tools
        uses: actions/cache@v5
        with:
          path: |
            apps/desktop/sentinel/build/macos-arm64/runtime
            apps/desktop/sentinel/build/macos-arm64/stamps
          key: bundled-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.image }}-xcode26.3-v1-${{ hashFiles('apps/desktop/sentinel/bundled-tools.lock.json', 'apps/desktop/sentinel/scripts/packaging/platforms/**') }}
          restore-keys: |
            bundled-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.image }}-xcode26.3-v1-

      - name: Cache packaging downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/Library/Caches/pip
          key: packaging-downloads-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('apps/desktop/sentinel/package-lock.json', 'apps/backend/sentinel/uv.lock') }}
          restore-keys: |
            packaging-downloads-${{ runner.os }}-${{ runner.arch }}-v1-

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: apps/frontend/sentinel/dist
      - name: Prepare runtime
        run: npm run desktop:prepare
      - name: Build and verify installer
        run: |
          npm run desktop:package
          mount_dir="$(mktemp -d)"
          trap 'hdiutil detach "$mount_dir"; rmdir "$mount_dir"' EXIT
          hdiutil attach release/*.dmg -readonly -nobrowse -mountpoint "$mount_dir"
          codesign --verify --deep --strict "$mount_dir/Sentinel.app"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-installer
          path: |
            apps/desktop/sentinel/release/*.dmg
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  desktop-payload:
    name: Build desktop payload
    # Its release index lists the runtime components, so it waits for their workflows.
    needs: [version, frontend-build, sentineld, sentinel-workspace]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SENTINEL_BUILD_CHANNEL: beta
      SENTINEL_FRONTEND_DIST: ${{ github.workspace }}/apps/frontend/sentinel/dist
      # The payload's release index lists the runtime components (payload-build.mjs).
      SENTINEL_COMPONENTS_DIR: ${{ github.workspace }}/apps/desktop/sentinel/build/components
      SENTINEL_INTERNAL_BUILD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
    defaults:
      run:
        working-directory: apps/desktop/sentinel
    steps:
      - uses: actions/checkout@v6
      - name: Select toolchain
        id: toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          test "$(uname -m)" = arm64
          echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/desktop/sentinel/package-lock.json
            apps/frontend/sentinel/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/sentinel/uv.lock
      - name: Cache bundled tools
        uses: actions/cache@v5
        with:
          path: |
            apps/desktop/sentinel/build/macos-arm64/runtime
            apps/desktop/sentinel/build/macos-arm64/stamps
          key: bundled-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.image }}-xcode26.3-v1-${{ hashFiles('apps/desktop/sentinel/bundled-tools.lock.json', 'apps/desktop/sentinel/scripts/packaging/platforms/**') }}
          restore-keys: |
            bundled-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.image }}-xcode26.3-v1-

      - name: Cache packaging downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/Library/Caches/pip
          key: packaging-downloads-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('apps/desktop/sentinel/package-lock.json', 'apps/backend/sentinel/uv.lock') }}
          restore-keys: |
            packaging-downloads-${{ runner.os }}-${{ runner.arch }}-v1-

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: apps/frontend/sentinel/dist
      - uses: actions/download-artifact@v8
        with:
          pattern: '{sentineld-release,sentinel-workspace-release}'
          merge-multiple: true
          path: apps/desktop/sentinel/build/components
      - name: Prepare runtime
        run: npm run desktop:prepare
      - name: Build payload
        run: npm run payload:build
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-payload
          path: |
            apps/desktop/sentinel/release/sentinel-payload-*.tar.gz
            apps/desktop/sentinel/release/sentineld-*.tar.gz
            apps/desktop/sentinel/release/sentinel-workspace-*.tar.gz
            apps/desktop/sentinel/release/latest-*.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  desktop-candidate:
    # This fixed name is required by branch protection.
    name: Build testable macOS installer and payload
    needs: [version, desktop-installer, desktop-payload]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check candidate builds
        if: github.base_ref != 'main'
        env:
          VERSION_RESULT: ${{ needs.version.result }}
          INSTALLER_RESULT: ${{ needs.desktop-installer.result }}
          PAYLOAD_RESULT: ${{ needs.desktop-payload.result }}
        run: |
          test "$VERSION_RESULT" = success
          test "$INSTALLER_RESULT" = success
          test "$PAYLOAD_RESULT" = success
      - uses: actions/checkout@v6
        if: github.base_ref == 'main'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        if: github.base_ref == 'main'
        with:
          node-version: '22'
      - name: Validate beta release for stable promotion
        if: github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_RESULT: ${{ needs.version.result }}
        run: |
          test "$VERSION_RESULT" = success
          node apps/desktop/sentinel/scripts/publishing/promote-release.mjs stable --check
