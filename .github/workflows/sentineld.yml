name: sentineld
# The workspace runtime (packages/sentineld): the daemon and, as `sentineld vm`, each VM, on the
# libraries packages/sentinel-workspace builds. Builds its release tarball (make release), the
# component the desktop app downloads. The candidate build (ci.yml) calls this; unchanged sources
# reuse the cached tarball, so libkrun, virglrenderer and Mesa never rebuild on unrelated PRs.
# Output: the `sentineld-release` artifact.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  key:
    name: Look up the sentineld release
    runs-on: ubuntu-24.04
    outputs:
      hit: ${{ steps.cache.outputs.cache-hit }}
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v6
      - id: key
        run: echo "key=sentineld-release-v1-${{ hashFiles('packages/sentineld/core/**', 'packages/sentineld/macos/**', 'packages/sentineld/media/**', 'packages/sentineld/guest/**', 'packages/sentineld/patches/**', 'packages/sentineld/Makefile', 'packages/sentinel-workspace/macos/**', 'packages/sentinel-workspace/Makefile', 'VERSION') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v5
        with:
          path: packages/sentineld/build/release
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
          enableCrossOsArchive: true

  macos:
    name: Build sentineld and the VM libraries; pack the release (macOS arm64)
    needs: key
    if: needs.key.outputs.hit != 'true'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      # The VM libraries' pinned tools and sources, plus their incremental build trees: keyed by every input.
      - uses: actions/cache@v5
        with:
          path: packages/sentinel-workspace/build/work
          key: sentinel-workspace-${{ runner.arch }}-${{ hashFiles('packages/sentinel-workspace/macos/scripts/**', 'packages/sentinel-workspace/macos/patches/**') }}
          restore-keys: sentinel-workspace-${{ runner.arch }}-
      - name: Build the daemon, the VM libraries, the media server, the tools and the guest share; pack the release
        working-directory: packages/sentineld
        run: make share release
      - name: Test the encoder and the renderers
        working-directory: packages/sentineld
        run: make test && make -C ../sentinel-workspace test
      - uses: actions/cache/save@v5
        with:
          path: packages/sentineld/build/release
          key: ${{ needs.key.outputs.key }}
          enableCrossOsArchive: true

  release:
    name: Publish the sentineld release artifact
    needs: [key, macos]
    if: always() && (needs.key.outputs.hit == 'true' || needs.macos.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/cache/restore@v5
        with:
          path: packages/sentineld/build/release
          key: ${{ needs.key.outputs.key }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true
      - uses: actions/upload-artifact@v7
        with:
          name: sentineld-release
          path: packages/sentineld/build/release/
          compression-level: 0
          retention-days: 14
