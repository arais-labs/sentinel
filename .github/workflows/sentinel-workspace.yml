name: sentinel-workspace
# The workspace VM process (packages/sentinel-workspace): builds its release tarball (make release),
# the component the desktop app downloads. The candidate build (ci.yml) calls this; unchanged sources
# reuse the cached tarball, so libkrun, virglrenderer and Mesa never rebuild on unrelated PRs.
# Output: the `sentinel-workspace-release` artifact.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  key:
    name: Look up the sentinel-workspace release
    runs-on: ubuntu-24.04
    outputs:
      hit: ${{ steps.cache.outputs.cache-hit }}
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v6
      - id: key
        run: echo "key=sentinel-workspace-release-v1-${{ hashFiles('packages/sentinel-workspace/macos/**', 'packages/sentinel-workspace/Makefile', 'packages/sentinel-workspace/requirements.txt') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v5
        with:
          path: packages/sentinel-workspace/build/release
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
          enableCrossOsArchive: true

  build:
    name: Build the VM process and its libraries; pack the release (macOS arm64)
    needs: key
    if: needs.key.outputs.hit != 'true'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      # Pinned tools and sources, plus the incremental build trees: keyed by every input.
      - uses: actions/cache@v5
        with:
          path: packages/sentinel-workspace/build/work
          key: sentinel-workspace-${{ runner.arch }}-${{ hashFiles('packages/sentinel-workspace/macos/scripts/**', 'packages/sentinel-workspace/macos/patches/**') }}
          restore-keys: sentinel-workspace-${{ runner.arch }}-
      - name: Test the encoder; build and pack the release
        working-directory: packages/sentinel-workspace
        run: make test release
      - uses: actions/cache/save@v5
        with:
          path: packages/sentinel-workspace/build/release
          key: ${{ needs.key.outputs.key }}
          enableCrossOsArchive: true

  release:
    name: Publish the sentinel-workspace release artifact
    needs: [key, build]
    if: always() && (needs.key.outputs.hit == 'true' || needs.build.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/cache/restore@v5
        with:
          path: packages/sentinel-workspace/build/release
          key: ${{ needs.key.outputs.key }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true
      - uses: actions/upload-artifact@v7
        with:
          name: sentinel-workspace-release
          path: packages/sentinel-workspace/build/release/
          compression-level: 0
          retention-days: 14
