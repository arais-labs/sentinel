<!doctype html>
<meta charset="utf-8">
<title>Sentinel browser pixel contract</title>
<style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;display:block}</style>
<canvas id="gpu"></canvas>
<script>
const token = new URLSearchParams(location.search).get('token');
let enterFullscreen = new URLSearchParams(location.search).get('fullscreen') === 'gesture';
let phase = 0, frame = 0, pending = false, failure = null;
const inputEvents = [];
for (const type of ['focus', 'blur', 'pointerdown', 'pointerup', 'click', 'fullscreenchange', 'fullscreenerror']) {
  addEventListener(type, event => {
    inputEvents.push({type, trusted:event.isTrusted, focused:document.hasFocus(),
      fullscreen:!!document.fullscreenElement, x:event.clientX, y:event.clientY});
    if (inputEvents.length > 16) inputEvents.shift();
  }, true);
}
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl', {antialias:false});
const colors = [[[255,0,0],[0,255,0]], [[0,0,255],[255,0,0]], [[0,255,0],[0,0,255]]];
const send = value => fetch('/report', {method:'POST', body:JSON.stringify({token,...value})});
addEventListener('error', e => send({error:String(e.message)}));
canvas.addEventListener('webglcontextlost', () => { failure = 'WebGL context lost'; });
canvas.addEventListener('click', () => {
  if (enterFullscreen) {
    enterFullscreen = false;
    document.documentElement.requestFullscreen().catch(e => { failure = String(e); });
    return;
  }
  phase = Math.max(phase, 1);
});
addEventListener('keydown', e => { if(e.code === 'Space' && phase === 1) phase = 2; });
try {
  if(!gl) throw Error('WebGL context unavailable');
  const compile = (type, text) => {
    const s = gl.createShader(type); gl.shaderSource(s,text); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(s));
    return s;
  };
  const program = gl.createProgram();
  gl.attachShader(program,compile(gl.VERTEX_SHADER,'attribute vec2 p; void main(){gl_Position=vec4(p,0.,1.);}'));
  gl.attachShader(program,compile(gl.FRAGMENT_SHADER,'precision mediump float; uniform vec3 leftColor,rightColor; uniform float middle; void main(){gl_FragColor=vec4(gl_FragCoord.x<middle?leftColor:rightColor,1.);}'));
  gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  const buffer = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const p=gl.getAttribLocation(program,'p'); gl.enableVertexAttribArray(p); gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);
  const info=gl.getExtension('WEBGL_debug_renderer_info');
  const renderer=gl.getParameter(info?info.UNMASKED_RENDERER_WEBGL:gl.RENDERER);
  if(/llvmpipe|softpipe|swiftshader/i.test(renderer)) throw Error('Software renderer: '+renderer);
  const context = () => ({frame,phase,renderer,contextLost:gl.isContextLost(),
    canvas:[canvas.width,canvas.height],drawingBuffer:[gl.drawingBufferWidth,gl.drawingBufferHeight],
    attributes:gl.getContextAttributes(),visible:document.visibilityState});
  const checkError = stage => {
    const error=gl.getError();
    if(error!==gl.NO_ERROR) throw Error('WebGL operation failed: '+JSON.stringify({stage,error,...context()}));
  };
  checkError('initialization');
  let viewportDeadline = null;
  async function draw() {
    try {
      if(failure) throw Error(failure);
      // A newly activated native tab can receive animation callbacks before
      // its first window configure. No pixels exist to qualify until then.
      if(innerWidth < 2 || innerHeight < 1) {
        viewportDeadline ??= performance.now() + 5000;
        if(performance.now() >= viewportDeadline)
          throw Error('Browser viewport remained empty: '+JSON.stringify({viewport:[innerWidth,innerHeight],...context()}));
        requestAnimationFrame(draw);
        return;
      }
      viewportDeadline = null;
      if(canvas.width!==innerWidth || canvas.height!==innerHeight) {
        canvas.width=innerWidth; canvas.height=innerHeight;
      }
      checkError('resize');
      gl.viewport(0,0,canvas.width,canvas.height);
      const expected=colors[phase];
      gl.uniform3fv(gl.getUniformLocation(program,'leftColor'),expected[0].map(x=>x/255));
      gl.uniform3fv(gl.getUniformLocation(program,'rightColor'),expected[1].map(x=>x/255));
      gl.uniform1f(gl.getUniformLocation(program,'middle'),canvas.width/2);
      gl.drawArrays(gl.TRIANGLES,0,3);
      checkError('draw');
      const pixels=[];
      for(const x of [.25,.75]) {
        const pixel=new Uint8Array(4); gl.readPixels(Math.floor(canvas.width*x),Math.floor(canvas.height/2),1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
        checkError('readPixels '+x);
        pixels.push(Array.from(pixel));
      }
      if(pixels.some((p,i)=>p.some((v,c)=>v!==(expected[i][c]??255)))) throw Error('GPU pixel mismatch: '+JSON.stringify({pixels,...context()}));
      frame++;
      if(!pending) {
        pending=true;
        send({phase,frame,renderer,rendererSource:info?'WEBGL_debug_renderer_info':'GL_RENDERER',pixels,size:[canvas.width,canvas.height],visible:document.visibilityState,focused:document.hasFocus(),fullscreen:!!document.fullscreenElement,inputEvents})
          .catch(e=>{failure=String(e);}).finally(()=>{pending=false;});
      }
      requestAnimationFrame(draw);
    } catch(e) { send({error:String(e)}); }
  }
  requestAnimationFrame(draw);
} catch(e) { send({error:String(e)}); }
</script>
