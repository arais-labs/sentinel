[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-backend"
version = "2.3.2"
description = "Sentinel agent backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "sentral-runtime==0.1.0",
  "fastapi>=0.141.1,<1.0.0",
  "uvicorn[standard]>=0.52.4,<1.0.0",
  "pydantic-settings>=2.15.0,<3.0.0",
  "sqlalchemy>=2.0.52,<3.0.0",
  "alembic>=1.19.2,<2.0.0",
  "aiosqlite>=0.22.1,<1.0.0",
  "sqlite-vec>=0.1.9,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "croniter>=6.2.4,<7.0",
  "pyyaml>=6.0.3,<7.0.0",
  "tiktoken>=0.14.0,<1.0.0",
  "playwright>=1.62.0,<2.0.0",
  "websockets>=17.1,<18.0",
  "python-telegram-bot>=22.8,<23.0",
  "asyncssh>=2.24.0,<3.0.0",
  "cryptography>=50.0.1,<51.0.0",
  "graphql-core>=3.2.12,<3.3",
  "fastembed>=0.8.0,<0.9",
  "mcp>=2.2,<3",
  "httpx2>=2.13,<3",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10.0.0",
  "pytest-asyncio>=1.4.0,<2.0.0",
  "black>=26.5.1,<27.0.0",
  "ruff>=0.16.7,<1",
]
desktop-build = [
  "pyinstaller>=6.22.2,<7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = "\\.pyi?$"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv.sources]
sentral-runtime = { path = "../../../packages/sentral", editable = true }
